<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>DataDash</h2>
                <button id="closeSidebar" class="mobile-only btn-icon">✕</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active">Dashboard</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-outline">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <button id="openSidebar" class="mobile-only btn-icon">☰</button>
                <div class="welcome-text">
                    <h1>Dashboard</h1>
                    <p>Welcome back, <span id="userNameDisplay">User</span>!</p>
                </div>
                <div class="user-profile">
                    <div class="avatar" id="userAvatar">U</div>
                </div>
            </header>

            <div class="dashboard-content">
                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Users</h3>
                        <p class="stat-value">12,345</p>
                        <p class="stat-change positive">+15% this month</p>
                    </div>
                    <div class="stat-card">
                        <h3>Revenue</h3>
                        <p class="stat-value">$45,678</p>
                        <p class="stat-change positive">+8% this month</p>
                    </div>
                    <div class="stat-card">
                        <h3>Active Sessions</h3>
                        <p class="stat-value">1,234</p>
                        <p class="stat-change negative">-2% this week</p>
                    </div>
                </div>

                <!-- Charts -->
                <div class="charts-grid">
                    <div class="chart-container">
                        <h3>Monthly Revenue</h3>
                        <canvas id="barChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3>User Distribution</h3>
                        <canvas id="pieChart"></canvas>
                    </div>
                    <div class="chart-container full-width">
                        <h3>User Growth Trend</h3>
                        <canvas id="lineChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
